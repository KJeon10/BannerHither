name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    name: Test and build (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Unit tests
        run: make test

      - name: Build app bundle
        run: make build

      - name: Archive
        run: ditto -c -k --keepParent build/BannerHither.app BannerHither-unsigned.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BannerHither-unsigned
          path: BannerHither-unsigned.zip
